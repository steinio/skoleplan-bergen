name = "skoleplan"
main = "worker.js"
compatibility_date = "2026-09-01"

# Counts live here. Create it once with:
#   npx wrangler kv namespace create COUNTS
# then paste the printed id below.
[[kv_namespaces]]
binding = "COUNTS"
id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"

[vars]
# Any random string. It salts the daily de-duplication hash so a visitor
# cannot be followed from one day to the next.
SALT = "change-me-to-something-random"
